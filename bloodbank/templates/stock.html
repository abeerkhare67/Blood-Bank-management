<!DOCTYPE html>
<html>
<head>
    <title>Blood Stock</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        header {
            background-color: #8b0000;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }

        .stock-box {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #8b0000;
            color: white;
            padding: 15px;
        }

        td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        .button {
            display: inline-block;
            padding: 10px 18px;
            margin-top: 20px;
            background-color: #8b0000;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .button:hover {
            background-color: #a00000;
        }
    </style>
</head>

<body>

<header>
    <h1>🩸 Blood Stock</h1>
    <p>Available Blood Groups</p>
</header>

<div class="container">

    <div class="stock-box">

        <table>

            <tr>
                <th>Blood Group</th>
                <th>Available Units</th>
            </tr>

            {% for stock in stocks %}

            <tr>
                <td>{{ stock.blood_group }}</td>
                <td>{{ stock.quantity }} units</td>
            </tr>

            {% empty %}

            <tr>
                <td colspan="2">
                    No blood stock available.
                </td>
            </tr>

            {% endfor %}

        </table>

        <a href="/" class="button">
            Back to Home
        </a>

    </div>

</div>

</body>
</html>
