<!DOCTYPE html>
<html>
<head>
    <title>Add Blood Request</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f5f5f5;
            text-align: center;
        }

        h1 {
            color: darkred;
        }

        .box {
            background: white;
            width: 400px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 10px;
        }

        input, select {
            width: 90%;
            padding: 10px;
            margin: 8px;
        }

        button {
            padding: 10px 25px;
            background-color: darkred;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🩸 Blood Request</h1>

        <form method="POST">

            {% csrf_token %}

            <input type="text" name="patient_name"
                   placeholder="Patient Name" required>

            <input type="text" name="blood_group"
                   placeholder="Blood Group (e.g. A+)" required>

            <input type="number" name="quantity"
                   placeholder="Quantity" required>

            <input type="text" name="hospital"
                   placeholder="Hospital Name" required>

            <input type="text" name="phone"
                   placeholder="Phone Number" required>

            <br>

            <button type="submit">Add to Queue</button>

        </form>

        <br>

        <a href="/queue/">View Queue</a>

    </div>

</body>
</html>
